<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Memory Bank 恢复栈</title>
  <desc id="desc">新会话读取 Current State、Intent、Standards 与 Evidence Links，经共享输入轨道推导 Next Safe Action；执行后经 Update Protocol 写回事实并生成 Events、Snapshots、Dashboard，供下一会话恢复。</desc>
  <defs>
    <style>
      svg {
        --background: #F7F8FA;
        --surface: #FFFFFF;
        --ink: #252A31;
        --muted: #5F6671;
        --border: #DDE1E7;
        --blue: #0F62FE;
        --green: #24A148;
        --purple: #8A3FFC;
      }
      .canvas { fill: #F7F8FA; fill: var(--background); }
      .card {
        fill: #FFFFFF;
        fill: var(--surface);
        stroke: #DDE1E7;
        stroke: var(--border);
        stroke-width: 1;
        vector-effect: non-scaling-stroke;
      }
      .zone {
        fill: #FFFFFF;
        fill: var(--surface);
        stroke: #DDE1E7;
        stroke: var(--border);
        stroke-width: 1;
        vector-effect: non-scaling-stroke;
      }
      .zone-mid {
        fill: #F7F8FA;
        fill: var(--background);
        stroke: #DDE1E7;
        stroke: var(--border);
        stroke-width: 1;
        stroke-dasharray: 4 4;
        vector-effect: non-scaling-stroke;
      }
      .cell {
        fill: #FFFFFF;
        fill: var(--surface);
        stroke: #DDE1E7;
        stroke: var(--border);
        stroke-width: 1;
        vector-effect: non-scaling-stroke;
      }
      .accent-blue { fill: #0F62FE; fill: var(--blue); }
      .accent-green { fill: #24A148; fill: var(--green); }
      .accent-purple { fill: #8A3FFC; fill: var(--purple); }
      .title, .body, .note {
        font-family: Inter, "Noto Sans SC", "PingFang SC", sans-serif;
        fill: #252A31;
        fill: var(--ink);
      }
      .title { font-size: 26px; font-weight: 700; }
      .body { font-size: 16px; font-weight: 650; }
      .note { font-size: 12px; font-weight: 450; fill: #5F6671; fill: var(--muted); }
      .kicker, .section-label {
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 1.4px;
      }
      .axis-label {
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 1.4px;
      }
      .path-term {
        font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
        font-size: 10px;
        font-weight: 400;
      }
      .formula-term {
        font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
        font-size: 13px;
        font-weight: 400;
      }
      .axis {
        fill: none;
        stroke: #5F6671;
        stroke: var(--muted);
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      .flow {
        fill: none;
        stroke: #5F6671;
        stroke: var(--muted);
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      .rail {
        fill: none;
        stroke: #5F6671;
        stroke: var(--muted);
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      .feedback {
        fill: none;
        stroke: #0F62FE;
        stroke: var(--blue);
        stroke-width: 1.3;
        stroke-dasharray: 4 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.72;
        vector-effect: non-scaling-stroke;
      }
      .repair-loop {
        fill: none;
        stroke: #5F6671;
        stroke: var(--muted);
        stroke-width: 1.4;
        stroke-dasharray: 3 4;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.85;
        vector-effect: non-scaling-stroke;
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5F6671"/>
    </marker>
    <marker id="feedback-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0F62FE"/>
    </marker>
  </defs>
  <rect class="canvas" x="0" y="0" width="960" height="540"/>

  <g id="figure-heading" data-role="heading">
    <text class="note kicker" x="64" y="40">MEMORY BANK · 04</text>
    <text class="title" x="64" y="72">Memory Bank 恢复栈</text>
  </g>

  <g id="thesis" data-role="thesis" data-card="thesis" transform="translate(64 92)">
    <rect class="card" x="0" y="0" width="832" height="56" rx="4" vector-effect="non-scaling-stroke"/>
    <rect class="accent accent-blue" x="0" y="0" width="5" height="56" rx="2"/>
    <text class="body" x="24" y="24">冷启动恢复闭环</text>
    <text class="note" x="24" y="44">读取事实源 → 安全动作 → 写回 → 下一会话恢复</text>
  </g>

  <g id="section-labels" data-role="labels">
    <text class="note section-label" x="64" y="176">READ</text>
    <text class="note section-label" x="456" y="176">DERIVE · UPDATE</text>
    <text class="note section-label" x="720" y="176">AUDIT</text>
  </g>

  <g id="inputs" data-role="inputs">
    <g data-card="current-state" data-stage="input" transform="translate(64 196)">
      <rect class="card" x="0" y="0" width="176" height="64" rx="4" vector-effect="non-scaling-stroke"/>
      <rect class="accent accent-blue" x="0" y="0" width="5" height="64" rx="2"/>
      <text class="body" x="16" y="28">Current State</text>
      <text class="note" x="16" y="48">tasks · current</text>
    </g>
    <g data-card="intent-scope" data-stage="input" transform="translate(64 276)">
      <rect class="card" x="0" y="0" width="176" height="64" rx="4" vector-effect="non-scaling-stroke"/>
      <rect class="accent accent-blue" x="0" y="0" width="5" height="64" rx="2"/>
      <text class="body" x="16" y="28">Intent Scope</text>
      <text class="note" x="16" y="48">目标与边界</text>
    </g>
    <g data-card="standards" data-stage="input" transform="translate(64 356)">
      <rect class="card" x="0" y="0" width="176" height="64" rx="4" vector-effect="non-scaling-stroke"/>
      <rect class="accent accent-purple" x="0" y="0" width="5" height="64" rx="2"/>
      <text class="body" x="16" y="28">Standards</text>
      <text class="note" x="16" y="48">术语 · 风格 · 门禁</text>
    </g>
    <g data-card="evidence-links" data-stage="input" transform="translate(64 436)">
      <rect class="card" x="0" y="0" width="176" height="64" rx="4" vector-effect="non-scaling-stroke"/>
      <rect class="accent accent-purple" x="0" y="0" width="5" height="64" rx="2"/>
      <text class="body" x="16" y="28">Evidence Links</text>
      <text class="note" x="16" y="48">events · reviews</text>
    </g>
  </g>

  <g id="shared-input-rail" data-role="shared-input">
    <path class="rail" d="M240 228H280" vector-effect="non-scaling-stroke"/>
    <path class="rail" d="M240 308H280" vector-effect="non-scaling-stroke"/>
    <path class="rail" d="M240 388H280" vector-effect="non-scaling-stroke"/>
    <path class="rail" d="M240 468H280" vector-effect="non-scaling-stroke"/>
    <path class="rail" d="M280 228V468" vector-effect="non-scaling-stroke"/>
    <path class="flow" d="M280 348H344" marker-end="url(#arrow)" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="process" data-role="process">
    <g data-card="next-safe-action" data-stage="main" transform="translate(344 268)">
      <rect class="card" x="0" y="0" width="184" height="80" rx="4" vector-effect="non-scaling-stroke"/>
      <rect class="accent accent-green" x="0" y="0" width="5" height="80" rx="2"/>
      <text class="body" x="16" y="34">Next Safe Action</text>
      <text class="note" x="16" y="56">从事实源推导下一步</text>
    </g>
    <path class="flow" d="M528 308H560" marker-end="url(#arrow)" vector-effect="non-scaling-stroke"/>
    <g data-card="update-protocol" data-stage="main" transform="translate(560 268)">
      <rect class="card" x="0" y="0" width="176" height="80" rx="4" vector-effect="non-scaling-stroke"/>
      <rect class="accent accent-green" x="0" y="0" width="5" height="80" rx="2"/>
      <text class="body" x="16" y="34">Update Protocol</text>
      <text class="note" x="16" y="56">执行并写回事实源</text>
    </g>
  </g>

  <path class="flow" d="M736 308H768" marker-end="url(#arrow)" vector-effect="non-scaling-stroke"/>

  <g id="output" data-role="output">
    <g data-card="audit-outputs" transform="translate(768 248)">
      <rect class="card" x="0" y="0" width="144" height="120" rx="4" vector-effect="non-scaling-stroke"/>
      <rect class="accent accent-blue" x="0" y="0" width="5" height="120" rx="2"/>
      <text class="body" x="16" y="48">Events</text>
      <text class="note" x="16" y="76">Snapshots</text>
    </g>
  </g>

  <g id="feedback-loop" data-role="feedback" data-target="shared-input-rail">
    <path class="feedback" d="M840 368V508H280V484" marker-end="url(#feedback-arrow)" vector-effect="non-scaling-stroke"/>
    <text class="note" x="560" y="528" text-anchor="middle">下一会话从更新后的事实源恢复</text>
  </g>

</svg>
