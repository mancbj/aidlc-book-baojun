<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">人类判断门禁</title>
  <desc id="desc">Intent 与 Boundary 先汇聚为共享约束轨道，AI Proposal 仅在边界内进入 Human Checkpoint；Accepted Work 写入 Evidence Record，反馈返回 Intent 与 Boundary，更新下一次人类判断。</desc>
  <defs>
    <style>
      svg {
        --background: #F7F8FA;
        --surface: #FFFFFF;
        --ink: #252A31;
        --muted: #5F6671;
        --border: #DDE1E7;
        --blue: #0F62FE;
        --green: #24A148;
        --purple: #8A3FFC;
      }
      .canvas { fill: #F7F8FA; fill: var(--background); }
      .card {
        fill: #FFFFFF;
        fill: var(--surface);
        stroke: #DDE1E7;
        stroke: var(--border);
        stroke-width: 1;
        vector-effect: non-scaling-stroke;
      }
      .zone {
        fill: #FFFFFF;
        fill: var(--surface);
        stroke: #DDE1E7;
        stroke: var(--border);
        stroke-width: 1;
        vector-effect: non-scaling-stroke;
      }
      .zone-mid {
        fill: #F7F8FA;
        fill: var(--background);
        stroke: #DDE1E7;
        stroke: var(--border);
        stroke-width: 1;
        stroke-dasharray: 4 4;
        vector-effect: non-scaling-stroke;
      }
      .cell {
        fill: #FFFFFF;
        fill: var(--surface);
        stroke: #DDE1E7;
        stroke: var(--border);
        stroke-width: 1;
        vector-effect: non-scaling-stroke;
      }
      .accent-blue { fill: #0F62FE; fill: var(--blue); }
      .accent-green { fill: #24A148; fill: var(--green); }
      .accent-purple { fill: #8A3FFC; fill: var(--purple); }
      .title, .body, .note {
        font-family: Inter, "Noto Sans SC", "PingFang SC", sans-serif;
        fill: #252A31;
        fill: var(--ink);
      }
      .title { font-size: 26px; font-weight: 700; }
      .body { font-size: 16px; font-weight: 650; }
      .note { font-size: 12px; font-weight: 450; fill: #5F6671; fill: var(--muted); }
      .kicker, .section-label {
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 1.4px;
      }
      .axis-label {
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 1.4px;
      }
      .path-term {
        font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
        font-size: 10px;
        font-weight: 400;
      }
      .formula-term {
        font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
        font-size: 13px;
        font-weight: 400;
      }
      .axis {
        fill: none;
        stroke: #5F6671;
        stroke: var(--muted);
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      .flow {
        fill: none;
        stroke: #5F6671;
        stroke: var(--muted);
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      .rail {
        fill: none;
        stroke: #5F6671;
        stroke: var(--muted);
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      .feedback {
        fill: none;
        stroke: #0F62FE;
        stroke: var(--blue);
        stroke-width: 1.3;
        stroke-dasharray: 4 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.72;
        vector-effect: non-scaling-stroke;
      }
      .repair-loop {
        fill: none;
        stroke: #5F6671;
        stroke: var(--muted);
        stroke-width: 1.4;
        stroke-dasharray: 3 4;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.85;
        vector-effect: non-scaling-stroke;
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5F6671"/>
    </marker>
    <marker id="feedback-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0F62FE"/>
    </marker>
  </defs>
  <rect class="canvas" x="0" y="0" width="960" height="540"/>

  <g id="figure-heading" data-role="heading">
    <text class="note kicker" x="64" y="40">HUMAN JUDGMENT · 02</text>
    <text class="title" x="64" y="72">人类判断门禁</text>
  </g>

  <g id="thesis" data-role="thesis" data-card="thesis" transform="translate(64 92)">
    <rect class="card" x="0" y="0" width="832" height="56" rx="4" vector-effect="non-scaling-stroke"/>
    <rect class="accent accent-blue" x="0" y="0" width="5" height="56" rx="2"/>
    <text class="body" x="24" y="24">AI 主动须在边界内</text>
    <text class="note" x="24" y="44">证据回写 Intent / Boundary，更新下一次判断</text>
  </g>

  <g id="section-labels" data-role="labels">
    <text class="note section-label" x="64" y="176">CONSTRAINTS</text>
    <text class="note section-label" x="360" y="176">GATE</text>
    <text class="note section-label" x="720" y="176">ACCEPTANCE</text>
  </g>

  <g id="inputs" data-role="inputs">
    <g data-card="intent" data-stage="input" transform="translate(64 196)">
      <rect class="card" x="0" y="0" width="200" height="72" rx="4" vector-effect="non-scaling-stroke"/>
      <rect class="accent accent-blue" x="0" y="0" width="5" height="72" rx="2"/>
      <text class="body" x="24" y="32">Intent</text>
      <text class="note" x="24" y="54">目标结果，非动作</text>
    </g>
    <g data-card="boundary" data-stage="input" transform="translate(64 292)">
      <rect class="card" x="0" y="0" width="200" height="72" rx="4" vector-effect="non-scaling-stroke"/>
      <rect class="accent accent-blue" x="0" y="0" width="5" height="72" rx="2"/>
      <text class="body" x="24" y="32">Boundary</text>
      <text class="note" x="24" y="54">约束与不可委托项</text>
    </g>
  </g>

  <g id="shared-input-rail" data-role="shared-input">
    <path class="rail" d="M264 232H304" vector-effect="non-scaling-stroke"/>
    <path class="rail" d="M264 328H304" vector-effect="non-scaling-stroke"/>
    <path class="rail" d="M304 232V328" vector-effect="non-scaling-stroke"/>
    <path class="flow" d="M304 280H360" marker-end="url(#arrow)" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="gate" data-role="process">
    <g data-card="ai-proposal" data-stage="main" transform="translate(360 240)">
      <rect class="card" x="0" y="0" width="152" height="80" rx="4" vector-effect="non-scaling-stroke"/>
      <rect class="accent accent-purple" x="0" y="0" width="5" height="80" rx="2"/>
      <text class="body" x="20" y="34">AI Proposal</text>
      <text class="note" x="20" y="56">边界内主动提议</text>
    </g>
    <path class="flow" d="M512 280H544" marker-end="url(#arrow)" vector-effect="non-scaling-stroke"/>
    <g data-card="human-checkpoint" data-stage="main" transform="translate(544 240)">
      <rect class="card" x="0" y="0" width="152" height="80" rx="4" vector-effect="non-scaling-stroke"/>
      <rect class="accent accent-green" x="0" y="0" width="5" height="80" rx="2"/>
      <text class="body" x="20" y="34">Human Gate</text>
      <text class="note" x="20" y="56">检查点与责任</text>
    </g>
  </g>

  <path class="flow" d="M696 280H720" marker-end="url(#arrow)" vector-effect="non-scaling-stroke"/>

  <g id="output" data-role="output">
    <g data-card="accepted-work" data-stage="main" transform="translate(720 240)">
      <rect class="card" x="0" y="0" width="176" height="80" rx="4" vector-effect="non-scaling-stroke"/>
      <rect class="accent accent-green" x="0" y="0" width="5" height="80" rx="2"/>
      <text class="body" x="20" y="34">Accepted Work</text>
      <text class="note" x="20" y="56">可进入工程轨道</text>
    </g>
  </g>

  <g id="evidence" data-role="constraints" data-card="evidence-record" transform="translate(360 384)">
    <rect class="card" x="0" y="0" width="336" height="72" rx="4" vector-effect="non-scaling-stroke"/>
    <rect class="accent accent-blue" x="0" y="0" width="5" height="72" rx="2"/>
    <text class="body" x="24" y="32">Evidence Record</text>
    <text class="note" x="24" y="54">记录判断、批准与偏差</text>
  </g>

  <path class="flow" d="M808 320V420H696" marker-end="url(#arrow)" vector-effect="non-scaling-stroke"/>

  <g id="feedback-loop" data-role="feedback" data-target="shared-input-rail">
    <path class="feedback" d="M360 420H304V344" marker-end="url(#feedback-arrow)" vector-effect="non-scaling-stroke"/>
    <text class="note" x="480" y="500" text-anchor="middle">证据反馈更新 Intent 与 Boundary</text>
  </g>

</svg>
