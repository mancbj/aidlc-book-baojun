<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Bolt 选择矩阵</title>
  <desc id="desc">以领域复杂度为横轴、风险与不可逆性为纵轴选择 Bolt 轨道：左下 Simple Construction（Plan→Implement→Test），右上 DDD Construction（Model→Design→ADR→Implement→Test）；中间灰区优先拆分 Bolt 或增加门禁。</desc>

  <defs>
    <style>
      svg {
        --background: #F7F8FA;
        --surface: #FFFFFF;
        --ink: #252A31;
        --muted: #5F6671;
        --border: #DDE1E7;
        --blue: #0F62FE;
        --green: #24A148;
        --purple: #8A3FFC;
      }
      .canvas { fill: #F7F8FA; fill: var(--background); }
      .card {
        fill: #FFFFFF;
        fill: var(--surface);
        stroke: #DDE1E7;
        stroke: var(--border);
        stroke-width: 1;
        vector-effect: non-scaling-stroke;
      }
      .zone {
        fill: #FFFFFF;
        fill: var(--surface);
        stroke: #DDE1E7;
        stroke: var(--border);
        stroke-width: 1;
        vector-effect: non-scaling-stroke;
      }
      .zone-mid {
        fill: #F7F8FA;
        fill: var(--background);
        stroke: #DDE1E7;
        stroke: var(--border);
        stroke-width: 1;
        stroke-dasharray: 4 4;
        vector-effect: non-scaling-stroke;
      }
      .cell {
        fill: #FFFFFF;
        fill: var(--surface);
        stroke: #DDE1E7;
        stroke: var(--border);
        stroke-width: 1;
        vector-effect: non-scaling-stroke;
      }
      .accent-blue { fill: #0F62FE; fill: var(--blue); }
      .accent-green { fill: #24A148; fill: var(--green); }
      .accent-purple { fill: #8A3FFC; fill: var(--purple); }
      .title,
      .body,
      .note {
        font-family: Inter, "Noto Sans SC", "PingFang SC", sans-serif;
        fill: #252A31;
        fill: var(--ink);
      }
      .title { font-size: 28px; font-weight: 700; }
      .body { font-size: 16px; font-weight: 650; }
      .note { font-size: 12px; font-weight: 450; fill: #5F6671; fill: var(--muted); }
      .kicker,
      .section-label {
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 1.4px;
      }
      .axis-label {
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 1.4px;
      }
      .path-term {
        font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
        font-size: 10px;
        font-weight: 400;
      }
      .formula-term {
        font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
        font-size: 13px;
        font-weight: 400;
      }
      .axis {
        fill: none;
        stroke: #5F6671;
        stroke: var(--muted);
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      .flow {
        fill: none;
        stroke: #5F6671;
        stroke: var(--muted);
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      .rail {
        fill: none;
        stroke: #5F6671;
        stroke: var(--muted);
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      .feedback {
        fill: none;
        stroke: #0F62FE;
        stroke: var(--blue);
        stroke-width: 1.3;
        stroke-dasharray: 4 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.72;
        vector-effect: non-scaling-stroke;
      }
      .repair-loop {
        fill: none;
        stroke: #5F6671;
        stroke: var(--muted);
        stroke-width: 1.4;
        stroke-dasharray: 3 4;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.85;
        vector-effect: non-scaling-stroke;
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5F6671"/>
    </marker>
    <marker id="feedback-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0F62FE"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="1200" height="675"/>

  <g id="figure-heading" data-role="heading">
    <text class="note kicker" x="64" y="44">BOLTS · 05</text>
    <text class="title" x="64" y="80">Bolt 选择矩阵</text>
    <text class="note" x="64" y="108">按复杂度与风险选择轨道；灰区先拆分，而不是硬选</text>
  </g>

  <g id="axes" data-role="labels">
    <path class="axis" d="M160 560H1040" marker-end="url(#arrow)" vector-effect="non-scaling-stroke"/>
    <path class="axis" d="M160 560V160" marker-end="url(#arrow)" vector-effect="non-scaling-stroke"/>
    <text class="note axis-label" x="600" y="600" text-anchor="middle">DOMAIN COMPLEXITY</text>
    <text class="note axis-label" x="96" y="360" text-anchor="middle" transform="rotate(-90 96 360)">RISK / IRREVERSIBILITY</text>
    <text class="note" x="200" y="552">Low</text>
    <text class="note" x="980" y="552">High</text>
    <text class="note" x="168" y="184">High</text>
    <text class="note" x="168" y="536">Low</text>
  </g>

  <g id="matrix-zones" data-role="process">
    <rect class="zone" x="200" y="360" width="280" height="160" rx="4" vector-effect="non-scaling-stroke"/>
    <rect class="zone" x="560" y="180" width="280" height="160" rx="4" vector-effect="non-scaling-stroke"/>
    <rect class="zone-mid" x="400" y="280" width="240" height="120" rx="4" vector-effect="non-scaling-stroke"/>

    <g data-card="simple-construction" transform="translate(220 388)">
      <rect class="card" x="0" y="0" width="240" height="104" rx="4" vector-effect="non-scaling-stroke"/>
      <rect class="accent accent-green" x="0" y="0" width="5" height="104" rx="2"/>
      <text class="body" x="20" y="40">Simple Construction</text>
      <text class="note" x="20" y="68">Plan → Implement → Test</text>
    </g>

    <g data-card="ddd-construction" transform="translate(580 208)">
      <rect class="card" x="0" y="0" width="240" height="104" rx="4" vector-effect="non-scaling-stroke"/>
      <rect class="accent accent-purple" x="0" y="0" width="5" height="104" rx="2"/>
      <text class="body" x="20" y="40">DDD Construction</text>
      <text class="note" x="20" y="68">Model → ADR → Implement</text>
    </g>

    <g data-card="gray-zone" transform="translate(420 304)">
      <rect class="card" x="0" y="0" width="200" height="72" rx="4" vector-effect="non-scaling-stroke"/>
      <rect class="accent accent-blue" x="0" y="0" width="5" height="72" rx="2"/>
      <text class="body" x="18" y="32">中间灰区</text>
      <text class="note" x="18" y="54">拆分 Bolt 或加门禁</text>
    </g>
  </g>

  <g id="decision-guide" data-role="constraints">
    <g data-card="selection-rule" transform="translate(880 220)">
      <rect class="card" x="0" y="0" width="256" height="88" rx="4" vector-effect="non-scaling-stroke"/>
      <rect class="accent accent-blue" x="0" y="0" width="5" height="88" rx="2"/>
      <text class="body" x="20" y="36">选择规则</text>
      <text class="note" x="20" y="60">不确定时先拆高风险部分</text>
    </g>
    <g data-card="simple-signal" transform="translate(880 332)">
      <rect class="card" x="0" y="0" width="256" height="72" rx="4" vector-effect="non-scaling-stroke"/>
      <rect class="accent accent-green" x="0" y="0" width="5" height="72" rx="2"/>
      <text class="body" x="20" y="32">Simple 信号</text>
      <text class="note" x="20" y="54">低复杂 · 低风险 · 可逆</text>
    </g>
    <g data-card="ddd-signal" transform="translate(880 428)">
      <rect class="card" x="0" y="0" width="256" height="72" rx="4" vector-effect="non-scaling-stroke"/>
      <rect class="accent accent-purple" x="0" y="0" width="5" height="72" rx="2"/>
      <text class="body" x="20" y="32">DDD 信号</text>
      <text class="note" x="20" y="54">跨边界 · 难逆 · 高复杂</text>
    </g>
  </g>

</svg>
