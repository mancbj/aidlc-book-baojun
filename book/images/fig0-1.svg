<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">AI-DLC 核心公式与确定性交付闭环</title>
  <desc id="desc">AI-DLC = 𝓔（人的判断 + AI 能力）。𝓔 = Engineering with Exsecutio。人的判断与 AI 能力先汇聚到共享输入轨道，再进入工程化执行并形成确定性交付；反馈返回共享输入轨道，更新判断与工程约束。</desc>

  <defs>
    <style>
      svg {
        --background: #F7F8FA;
        --surface: #FFFFFF;
        --ink: #252A31;
        --muted: #5F6671;
        --border: #DDE1E7;
        --blue: #0F62FE;
        --green: #24A148;
        --purple: #8A3FFC;
      }
      .canvas { fill: #F7F8FA; fill: var(--background); }
      .card {
        fill: #FFFFFF;
        fill: var(--surface);
        stroke: #DDE1E7;
        stroke: var(--border);
        stroke-width: 1;
        vector-effect: non-scaling-stroke;
      }
      .accent-blue { fill: #0F62FE; fill: var(--blue); }
      .accent-green { fill: #24A148; fill: var(--green); }
      .accent-purple { fill: #8A3FFC; fill: var(--purple); }
      .title,
      .body,
      .note {
        font-family: Inter, "Noto Sans SC", "PingFang SC", sans-serif;
        fill: #252A31;
        fill: var(--ink);
      }
      .title { font-size: 26px; font-weight: 700; }
      .formula-text { font-size: 30px; font-weight: 680; }
      .body { font-size: 21px; font-weight: 650; }
      .note { font-size: 14px; font-weight: 450; fill: #5F6671; fill: var(--muted); }
      .kicker,
      .section-label {
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 1.4px;
      }
      .formula-term {
        font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
        font-size: 15px;
        font-weight: 400;
      }
      .flow {
        fill: none;
        stroke: #5F6671;
        stroke: var(--muted);
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      .rail {
        fill: none;
        stroke: #5F6671;
        stroke: var(--muted);
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      .feedback {
        fill: none;
        stroke: #0F62FE;
        stroke: var(--blue);
        stroke-width: 1.3;
        stroke-dasharray: 4 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.72;
        vector-effect: non-scaling-stroke;
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5F6671"/>
    </marker>
    <marker id="feedback-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0F62FE"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="960" height="540"/>

  <g id="figure-heading" data-role="heading">
    <text class="note kicker" x="64" y="44">CORE CONCEPT · 01</text>
    <text class="title" x="64" y="78">AI-DLC 核心公式与确定性交付闭环</text>
  </g>

  <g id="core-formula" data-role="thesis" data-card="core-formula" transform="translate(64 108)">
    <rect class="card" x="0" y="0" width="832" height="84" rx="4" vector-effect="non-scaling-stroke"/>
    <rect class="accent accent-blue" x="0" y="0" width="5" height="84" rx="2"/>
    <text class="title formula-text" x="32" y="43">AI-DLC = 𝓔（人的判断 + AI 能力）</text>
    <text class="note formula-term" x="32" y="69">𝓔 = Engineering with Exsecutio</text>
  </g>

  <g id="section-labels" data-role="labels">
    <text class="note section-label" x="64" y="224">SHARED INPUTS</text>
    <text class="note section-label" x="368" y="224">ENGINEERING</text>
    <text class="note section-label" x="680" y="224">DELIVERY</text>
  </g>

  <g id="inputs" data-role="inputs">
    <g data-card="human-judgment" data-stage="input" transform="translate(64 244)">
      <rect class="card" x="0" y="0" width="216" height="88" rx="4" vector-effect="non-scaling-stroke"/>
      <rect class="accent accent-blue" x="0" y="0" width="5" height="88" rx="2"/>
      <text class="body" x="24" y="38">人的判断</text>
      <text class="note" x="24" y="64">目标 · 边界 · 责任</text>
    </g>
    <g data-card="ai-capability" data-stage="input" transform="translate(64 352)">
      <rect class="card" x="0" y="0" width="216" height="88" rx="4" vector-effect="non-scaling-stroke"/>
      <rect class="accent accent-green" x="0" y="0" width="5" height="88" rx="2"/>
      <text class="body" x="24" y="38">AI 能力</text>
      <text class="note" x="24" y="64">生成 · 推理 · 加速度</text>
    </g>
  </g>

  <g id="shared-input-rail" data-role="shared-input">
    <path class="rail" d="M280 288H320" vector-effect="non-scaling-stroke"/>
    <path class="rail" d="M280 396H320" vector-effect="non-scaling-stroke"/>
    <path class="rail" d="M320 288V396" vector-effect="non-scaling-stroke"/>
    <path class="flow" d="M320 340H368" marker-end="url(#arrow)" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="engineering" data-role="process" data-card="engineering" data-stage="main" transform="translate(368 292)">
    <rect class="card" x="0" y="0" width="216" height="96" rx="4" vector-effect="non-scaling-stroke"/>
    <rect class="accent accent-purple" x="0" y="0" width="5" height="96" rx="2"/>
    <text class="body" x="24" y="41">工程化执行</text>
    <text class="note" x="24" y="69">事实源 · 门禁 · 证据链</text>
  </g>

  <path id="main-flow" class="flow" d="M584 340H680" marker-end="url(#arrow)" vector-effect="non-scaling-stroke"/>

  <g id="delivery" data-role="output" data-card="deterministic-delivery" data-stage="main" transform="translate(680 292)">
    <rect class="card" x="0" y="0" width="216" height="96" rx="4" vector-effect="non-scaling-stroke"/>
    <rect class="accent accent-green" x="0" y="0" width="5" height="96" rx="2"/>
    <text class="body" x="24" y="41">确定性交付</text>
    <text class="note" x="24" y="69">可验证 · 可追溯 · 可复现</text>
  </g>

  <g id="feedback-loop" data-role="feedback" data-target="shared-input-rail">
    <path class="feedback" d="M788 388V472H320V404" marker-end="url(#feedback-arrow)" vector-effect="non-scaling-stroke"/>
    <text class="note" x="552" y="500" text-anchor="middle">反馈更新判断与工程约束</text>
  </g>
</svg>
