name: Update Star History

on:
  schedule:
    # 06:15 UTC daily — after most US/EU activity, before CN morning
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: star-history
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install chart dependencies
        run: pip install -r scripts/requirements-star-history.txt
      - name: Render star history PNGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_star_history.py --repo mancbj/aidlc-book-baojun --refresh
      - name: Commit updated charts when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history-light.png assets/star-history-dark.png scripts/.star-history-cache.json
          if git diff --cached --quiet; then
            echo "Star history unchanged; skip commit."
            exit 0
          fi
          git commit -m "[charts] update star history [skip ci]"
          git push origin HEAD:main
