name: Prepare and Publish Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version such as v0.1 or v0.1-rc.1
        required: true
        type: string
      pdf_path:
        description: Optional repository-relative verified PDF path
        required: false
        type: string
      publish:
        description: Create a draft GitHub Release after building
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Resolve and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="$INPUT_VERSION"
          fi
          python3 - "$version" <<'PY'
          import re, sys
          if not re.fullmatch(r"v\d+\.\d+(?:\.\d+)?(?:-[0-9A-Za-z.-]+)?", sys.argv[1]):
              raise SystemExit("invalid release version")
          PY
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli@11.4.0
      - run: python3 scripts/ci_check.py --budget-seconds 180

  build:
    needs: [validate, readiness]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Download the exact readiness evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-readiness
          path: .artifacts/readiness
      - name: Prepare immutable release candidate
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PDF_PATH: ${{ inputs.pdf_path }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            "$VERSION"
            --output ".artifacts/release/$VERSION"
            --commit-sha "$GITHUB_SHA"
            --readiness .artifacts/readiness/readiness.json
            --release-notes .artifacts/readiness/release-notes.md
          )
          if [ -z "${PDF_PATH}" ]; then
            for candidate in \
              "releases/${VERSION}-rc/aidlc-book-${VERSION}.pdf" \
              "releases/${VERSION}-rc/ai-dlc-book-${VERSION}.pdf"
            do
              if [ -f "$candidate" ]; then
                PDF_PATH="$candidate"
                break
              fi
            done
          fi
          if [ -n "${PDF_PATH}" ]; then
            args+=(--pdf "$PDF_PATH")
          fi
          book_html="releases/${VERSION}-rc/aidlc-book-${VERSION}-book.html"
          if [ -f "$book_html" ]; then
            args+=(--book-html "$book_html")
          fi
          python3 scripts/prepare_release.py "${args[@]}"
      - name: Upload candidate for review or publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: .artifacts/release/${{ needs.validate.outputs.version }}
          retention-days: 14
          if-no-files-found: error

  readiness:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Evaluate release Definition of Done and always keep the gap report
        id: gate
        continue-on-error: true
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/readiness
          policy="planning/releases/${VERSION}-policy.json"
          args=(
            --json-report .artifacts/readiness/readiness.json
            --markdown-report .artifacts/readiness/readiness.md
          )
          if [ -f "$policy" ]; then
            args+=(--policy "$policy")
          fi
          python3 scripts/check_release_readiness.py "${args[@]}"
      - name: Render notes only for a ready source
        if: steps.gate.outcome == 'success'
        run: >-
          python3 scripts/render_release_notes.py
          --readiness .artifacts/readiness/readiness.json
          --output .artifacts/readiness/release-notes.md
          --require-ready
      - name: Upload readiness or the sorted blocker report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-readiness
          path: .artifacts/readiness
          retention-days: 30
          if-no-files-found: error
      - name: Enforce readiness before build or publish
        if: steps.gate.outcome != 'success'
        run: |
          echo "Release readiness is blocked; download release-readiness for the sorted repair list." >&2
          exit 1

  publish:
    needs: [validate, readiness, build]
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download the exact reviewed candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: .artifacts/candidate
      - name: Refuse overwrite and create Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; refusing overwrite." >&2
            exit 1
          fi
          release_args=(
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$VERSION"
            --generate-notes
            --notes-file .artifacts/candidate/release-notes.md
          )
          if [ "$EVENT_NAME" != "push" ]; then
            release_args+=(--draft)
          fi
          gh release create "$VERSION" .artifacts/candidate/* \
            "${release_args[@]}"
