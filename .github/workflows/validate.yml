name: Validate Pull Request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Facts, tests, links and generation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up Node (Mermaid CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install book build tools
        uses: ./.github/actions/book-build-tools
      - name: Run the read-only PR gate
        run: python3 scripts/ci_check.py --budget-seconds 180
