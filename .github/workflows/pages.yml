name: Record Progress and Publish Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python3 scripts/ci_check.py --budget-seconds 60

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Generate progress from the source commit
        run: python3 scripts/generate_progress.py --actor github-actions
      - name: Build the publish tree
        run: >-
          python3 scripts/prepare_pages.py
          --output .artifacts/pages
          --commit-sha "$GITHUB_SHA"
          --workflow-run "$GITHUB_RUN_ID"
      - name: Inspect Pages settings without auto-enabling
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .artifacts/pages

  record:
    needs: validate
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Generate allow-listed progress records
        run: python3 scripts/generate_progress.py --actor github-actions
      - name: Stage only generated projections and history
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            progress/generated/current.json \
            progress/generated/current.md \
            progress/generated/last-successful-facts.json \
            progress/events/events.jsonl \
            progress/snapshots \
            progress/CHANGELOG.md \
            site/index.html \
            site/details.html \
            site/data/progress.json
          mkdir -p .artifacts
          tar -czf .artifacts/progress-record.tgz \
            progress/generated progress/events progress/snapshots progress/CHANGELOG.md \
            site/index.html site/details.html site/data/progress.json
          if git diff --cached --quiet; then
            echo "persisted=unchanged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "[progress] record ${GITHUB_SHA} [skip ci]"
          set +e
          git push origin HEAD:main
          push_status=$?
          set -e
          if [ "$push_status" -eq 0 ]; then
            echo "persisted=pushed" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Branch protection prevented the generated record commit. Download progress-record and open a maintainer PR."
            echo "persisted=artifact-only" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload recoverable progress record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: progress-record-${{ github.sha }}
          path: .artifacts/progress-record.tgz
          retention-days: 30
          if-no-files-found: error

  deploy:
    needs: build
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
