name: Install book build toolchain (Pandoc + Mermaid CLI)

runs:
  using: composite
  steps:
    - name: Install Pandoc
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y pandoc
    - name: Install Mermaid CLI
      shell: bash
      run: |
        set -euo pipefail
        npm install -g @mermaid-js/mermaid-cli@11.4.0
